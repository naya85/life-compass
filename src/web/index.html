<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Life Compass</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="mesh" aria-hidden="true"></div>
<main class="wrap">
  <header class="head">
    <div class="greet">
      <span class="avatar" id="avatar" aria-hidden="true">·</span>
      <div><h1 id="hello">Life Compass</h1><p class="sub" id="sub"></p></div>
    </div>
    <div class="head-right">
      <div class="chips" id="chips"></div>
      <div class="menu-wrap">
        <button class="plus" id="menuBtn" type="button" aria-label="Add or review" aria-haspopup="menu" aria-expanded="false">+</button>
        <div class="menu" id="menu" role="menu" hidden></div>
      </div>
    </div>
  </header>

  <section class="empty" id="empty" hidden>
    <img class="empty-art" src="assets/mountain/s1.png" alt="">
    <h2 id="emptyTitle">Your Compass is waiting</h2>
    <p id="emptyText">Answer a few questions about your year. As you go, your plan appears here.</p>
    <button class="btn big" id="startBtn" type="button">Start reflecting</button>
    <p class="alt">Or open your AI app and say "Start my Life Compass".</p>
  </section>

  <section class="grid" id="grid" hidden>
    <div class="hero">
      <div class="ring-wrap" id="ringWrap">
        <span class="mtn" id="mtnBack" aria-hidden="true"></span>
        <span class="glass" aria-hidden="true"></span>
        <svg class="rings" id="rings" viewBox="-24 -24 248 248" role="img" aria-label="Progress on each goal"></svg>
        <span class="hole" aria-hidden="true"></span>
        <span class="mtn mtn-front" id="mtnFront" aria-hidden="true"></span>
        <span class="center"><span class="pct" id="pct">0%</span><span class="cap" id="cap">of milestones done</span></span>
      </div>
      <div class="next" id="next"></div>
    </div>

    <div class="cards">
      <article class="card" id="weekCard">
        <div class="card-head"><h2>This week</h2><span class="muted" id="weekMeta"></span></div>
        <div class="tiles" id="tiles"></div>
      </article>
      <article class="card" id="dueCard">
        <div class="card-head"><h2>Coming up</h2></div>
        <ul class="due" id="due"></ul>
      </article>
    </div>

    <article class="card wide" id="goalsCard">
      <div class="card-head"><h2>Goals</h2><span class="muted" id="goalsMeta"></span></div>
      <div class="goals" id="goals"></div>
    </article>

    <article class="card wide" id="winsCard">
      <div class="card-head"><h2>Wins</h2><span class="muted" id="winsMeta"></span></div>
      <form class="win-form" id="winForm">
        <input id="winText" type="text" placeholder="What did you do, and what changed because of it?" aria-label="New win" autocomplete="off">
        <button class="btn" type="submit">Add</button>
      </form>
      <ul class="wins" id="wins"></ul>
    </article>
  </section>

</main>
<p class="toast" id="toast" role="status" hidden></p>
<script src="app.js"></script>
<script src="guide.js"></script>
</body>
</html>
